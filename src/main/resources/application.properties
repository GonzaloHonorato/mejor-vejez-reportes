spring.application.name=mejor-vejez-reportes
server.port=${SERVER_PORT:8082}

# URL interna del servicio core (en Dokploy: http://mejor-vejez-api:8080).
mejorvejez.core-url=${CORE_URL:http://localhost:8080}
# Clave compartida entre los microservicios (cabecera X-Clave-Servicio).
# Vacía = las rutas internas rechazan todo (401).
mejorvejez.interno.clave-servicio=${CLAVE_SERVICIO:}
# URL interna del microservicio de alertas y notificaciones.
mejorvejez.alertas-url=${ALERTAS_URL:http://localhost:8081}

# Reporte semanal: primera corrida a las 08:00 y luego cada hora hasta las
# 20:00 (America/Santiago); la reserva de envío evita duplicados.
mejorvejez.reportes.cron=${REPORTES_CRON:0 0 8-20 * * MON}
# Interruptor general de los procesos programados (igual que en alertas).
mejorvejez.procesos.habilitados=${PROCESOS_HABILITADOS:true}
